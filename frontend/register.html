<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — HeritageAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header id="main-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="width: 100%; max-width: 26rem;" class="card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 class="font-serif" style="font-size: 2rem; color: var(--heritage-green-600); margin-bottom: 0.25rem;">Create Account</h1>
        <p style="font-size: 0.85rem; color: #6b7280;">Join as a custodian of cultural heritage</p>
      </div>

      <div id="register-error" style="display: none; background-color: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.8rem; margin-bottom: 1.25rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="Elder Custodian" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
          Register Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #6b7280;">
        Already have an account? <a href="login.html" style="color: var(--heritage-green-600); font-weight: 700;">Log in here</a>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="js/common.js"></script>
  <script type="module">
    import { registerUser } from "./js/api.js";

    document.getElementById("register-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const password = document.getElementById("reg-password").value;
      const errorDiv = document.getElementById("register-error");
      const btn = document.getElementById("register-submit-btn");

      errorDiv.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Registering...";

      try {
        await registerUser(name, email, password);
        alert("Account registered successfully! Please log in.");
        window.location.href = "login.html";
      } catch (err) {
        errorDiv.textContent = err.message || "Registration failed.";
        errorDiv.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Register Account";
      }
    });
  </script>
</body>
</html>
