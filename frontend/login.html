<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — HeritageAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header id="main-header"></header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem;">
    <div style="width: 100%; max-width: 26rem;" class="card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 class="font-serif" style="font-size: 2rem; color: var(--heritage-green-600); margin-bottom: 0.25rem;">Welcome Back</h1>
        <p style="font-size: 0.85rem; color: #6b7280;">Log in to continue preserving elder heritage</p>
      </div>

      <div id="login-error" style="display: none; background-color: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.8rem; margin-bottom: 1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
          Log In
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #6b7280;">
        Don't have an account? <a href="register.html" style="color: var(--heritage-green-600); font-weight: 700;">Register here</a>
      </div>
    </div>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="js/common.js"></script>
  <script type="module">
    import { loginUser } from "./js/api.js";
    import { saveToken, saveUser } from "./js/auth.js";

    document.getElementById("login-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const errorDiv = document.getElementById("login-error");
      const btn = document.getElementById("login-submit-btn");

      errorDiv.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const data = await loginUser(email, password);
        saveToken(data.access_token);
        saveUser(data.user);
        window.location.href = "index.html";
      } catch (err) {
        errorDiv.textContent = err.message || "Invalid credentials.";
        errorDiv.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
