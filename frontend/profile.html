<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — HeritageAI</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .profile-tab-btn {
      padding: 0.75rem 1.25rem;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .profile-tab-btn.active {
      color: var(--heritage-green-600);
      border-bottom-color: var(--gold-600);
    }
  </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <header id="main-header"></header>

  <main style="flex: 1; padding: 3rem 0;">
    <div class="container" style="max-width: 54rem;">
      
      <!-- Profile Header Card -->
      <div class="card" style="margin-bottom: 2rem; position: relative;">
        <div class="flex flex-col md:flex-row items-center gap-6">
          <div style="position: relative;">
            <div id="profile-avatar-display" class="avatar-badge" style="width: 5rem; height: 5rem; font-size: 1.75rem; border-radius: 50%;">
              DS
            </div>
            <label for="avatar-file-input" style="position: absolute; bottom: 0; right: 0; background-color: var(--heritage-green-600); color: #ffffff; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; border: 2px solid #ffffff;">
              📷
            </label>
            <input type="file" id="avatar-file-input" accept="image/*" style="display: none;">
          </div>

          <div style="flex: 1; text-align: center; font-size: 0.9rem;" class="md:text-left">
            <h2 id="profile-display-name" class="font-serif" style="font-size: 1.75rem; color: var(--heritage-green-600); margin: 0;">
              Elder Custodian
            </h2>
            <p id="profile-username" style="font-family: var(--font-mono); color: #9ca3af; font-size: 0.8rem;">@caretaker</p>
            <p id="profile-bio-text" style="color: #4b5563; margin-top: 0.5rem; line-height: 1.5;">
              Custodian of cultural memory. Recording and preserving elder histories for future generations.
            </p>
          </div>

          <div class="flex gap-6" style="border-left: 1px solid var(--border-color); padding-left: 1.5rem;">
            <div style="text-align: center;">
              <p id="my-posts-count" class="font-serif" style="font-size: 1.5rem; font-weight: 900; color: var(--heritage-green-600); margin: 0;">0</p>
              <p style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #9ca3af;">Interviews</p>
            </div>
            <div style="text-align: center;">
              <p id="saved-stories-count" class="font-serif" style="font-size: 1.5rem; font-weight: 900; color: var(--gold-600); margin: 0;">0</p>
              <p style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: #9ca3af;">Saved</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <div style="border-bottom: 1px solid var(--border-color); margin-bottom: 2rem; display: flex; gap: 1rem;">
        <button class="profile-tab-btn active" data-tab="posts">My Preserved Interviews</button>
        <button class="profile-tab-btn" data-tab="saved">Saved Stories</button>
        <button class="profile-tab-btn" data-tab="settings">Account Settings</button>
      </div>

      <!-- Tab 1: My Preserved Interviews -->
      <div id="tab-content-posts" class="profile-tab-content">
        <div id="my-interviews-list">
          <!-- Injected via profile.js -->
        </div>
      </div>

      <!-- Tab 2: Saved Stories -->
      <div id="tab-content-saved" class="profile-tab-content" style="display: none;">
        <div id="saved-stories-list">
          <!-- Injected via profile.js -->
        </div>
      </div>

      <!-- Tab 3: Account Settings -->
      <div id="tab-content-settings" class="profile-tab-content" style="display: none;">
        <div class="card" style="max-width: 32rem; margin: 0 auto;">
          <h3 class="font-serif" style="font-size: 1.25rem; color: var(--heritage-green-600); margin-bottom: 1.25rem;">Edit Profile Information</h3>

          <div class="form-group">
            <label class="form-label">Display Name</label>
            <input type="text" id="edit-display-name" class="form-input">
          </div>

          <div class="form-group">
            <label class="form-label">Username Handle</label>
            <input type="text" id="edit-username" class="form-input" placeholder="@handle">
          </div>

          <div class="form-group">
            <label class="form-label">Bio Description</label>
            <textarea id="edit-bio" class="form-textarea" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Website Theme Palette</label>
            <select id="theme-select" class="form-select">
              <option value="cream">Warm Cream (Default Heritage)</option>
              <option value="forest">Forest Green</option>
              <option value="gold">Gold Ochre</option>
            </select>
          </div>

          <button id="save-settings-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Save Settings</button>
        </div>
      </div>

    </div>
  </main>

  <footer id="main-footer"></footer>

  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
